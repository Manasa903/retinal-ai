{% extends "base.html" %}

{% block content %}
<style>
body {
    background: url("https://static.vecteezy.com/system/resources/thumbnails/053/716/658/small/illustration-of-a-blue-stylized-eye-with-intricate-details-symbolizing-vision-technology-and-insight-on-a-transparent-background-png.png") no-repeat center center fixed;
    background-size: cover;
}
</style>

<style>

/* Detection Page Styling */
.detect-container {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.detect-card {
    background: #ffffff;
    width: 420px;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    text-align: center;
}

.detect-card h2 {
    color: #004d71;
    margin-bottom: 20px;
}

.upload-box {
    border: 2px dashed #004d71;
    padding: 20px;
    border-radius: 15px;
    cursor: pointer;
    background: #f5fbff;
}

.upload-box input {
    display: none;
}

.upload-box p {
    color: #555;
    font-size: 14px;
}

.preview {
    margin-top: 15px;
    display: none;
}

.preview img {
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    border-radius: 15px;
    border: 2px solid #eee;
}

.predict-btn {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #0077b6, #00b4d8);
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease;
}

.predict-btn:hover {
    transform: scale(1.03);
}
</style>

<div class="detect-container">
    <div class="detect-card">
        <h2>Upload OCT Image</h2>

        <form method="post" enctype="multipart/form-data">
            <label>
                <input type="file" name="image" accept="image/*" required onchange="previewImage(event)">
                <p>📤 Click to upload OCT image</p>
            </label>

            <div class="preview" id="preview">
                <img id="previewImg">
            </div>

            <button type="submit" class="predict-btn"> Predict</button>
        </form>
    </div>
</div>

<script>
function previewImage(event) {
    const preview = document.getElementById("preview");
    const img = document.getElementById("previewImg");
    img.src = URL.createObjectURL(event.target.files[0]);
    preview.style.display = "block";
}
</script>

{% endblock %}
